name: Refresh profile graphics

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - tests/**
      - .github/workflows/profile.yml

permissions:
  contents: read

concurrency:
  group: profile-graphics
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify theme rotation and rendering
        run: python -m unittest discover -s tests -v
      - name: Collect public statistics and render SVGs
        env:
          PUBLIC_API_TOKEN: ${{ github.token }}
        run: python scripts/render_profile.py --refresh
      - uses: actions/upload-artifact@v4
        with:
          name: public-profile-statistics
          path: assets/stats.json
          retention-days: 1

  publish:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: public-profile-statistics
          path: ${{ runner.temp }}/profile-snapshot
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Save graphics
        env:
          PROFILE_SNAPSHOT: ${{ runner.temp }}/profile-snapshot/stats.json
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            # This is the disposable Actions checkout. Re-render from the latest
            # source instead of merging generated SVG/JSON files during a rebase.
            git reset --hard origin/main
            python scripts/render_profile.py --snapshot "$PROFILE_SNAPSHOT"
            python scripts/validate_profile.py
            git add assets/ themes/ README.md
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m 'Refresh profile graphics'
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo 'Publication could not catch up with main; no generated files were merged.'
          exit 1
