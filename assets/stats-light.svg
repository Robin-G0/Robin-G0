.accent { fill: #006ca9; }
.gold { fill: #7a3d7a; }
.bar { transform-box: fill-box; transform-origin: left; animation: fill 1.5s ease-out backwards; }
@keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
text { font-weight: 300; } rect { rx: 0; } .trigger { stroke-width: 4; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .trail { stroke-dashoffset: 0 !important; } }
