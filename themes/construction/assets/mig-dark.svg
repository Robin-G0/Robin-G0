<svg xmlns="http://www.w3.org/2000/svg" width="900" height="332" viewBox="0 0 900 332" role="img" aria-labelledby="title">
<title id="title">Motion Input Grid — movement follows three required cells to an action trigger</title>
<style>
text { font-family: Verdana, sans-serif; fill: #ffffff; }
.mono { font-family: Consolas, 'Liberation Mono', monospace; letter-spacing: 2px; fill: #ccc0ff; }
.muted { fill: #ccc0ff; }
.accent { fill: #5affee; }
.gold { fill: #ffff55; }
.trail { animation: draw 6s ease-in-out infinite; }
@keyframes draw { 0%, 8% { stroke-dashoffset: 1; } 65%, 88% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 1; } }
.trigger { transform-box: fill-box; transform-origin: center; animation: pulse 6s ease-in-out infinite; }
@keyframes pulse { 0%, 60%, 100% { opacity: .25; transform: scale(.85); } 72%, 88% { opacity: 1; transform: scale(1.15); } }
.aircraft { filter: drop-shadow(3px 3px 0 #ff49d2); } .trigger { stroke-dasharray: 3 3; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .trail { stroke-dashoffset: 0 !important; } }
</style>
<rect x="1" y="1" width="898" height="330" rx="0" fill="#080823" stroke="#745be0"/>
<path d="M9 60 h6 M12 57 v6" stroke="#ffff55" opacity=".4"/><path d="M881 90 h6 M884 87 v6" stroke="#ffff55" opacity=".4"/><path d="M477 64 h6 M480 61 v6" stroke="#ffff55" opacity=".4"/><path d="M537 280 h6 M540 277 v6" stroke="#ffff55" opacity=".4"/><path d="M17 309 h6 M20 306 v6" stroke="#ffff55" opacity=".4"/><path d="M876 299 h6 M879 296 v6" stroke="#ffff55" opacity=".4"/><path d="M8 325 H892" stroke="#ffff55" stroke-width="5" stroke-dasharray="12 8"/>
<text x="36" y="43" class="mono" font-size="12" >01 / CURRENT PROJECT</text><text x="36" y="96" class="" font-size="34" font-weight="700">Motion Input Grid</text><text x="36" y="133" class="accent" font-size="20" >Turn a movement into an action.</text><text x="36" y="176" class="muted" font-size="16" >An open-source motion input framework</text><text x="36" y="202" class="muted" font-size="16" >for websites, desktop applications and games.</text><rect x="36" y="238" width="172" height="36" rx="18" fill="#20204b"/><text x="53" y="262" class="accent" font-size="12" font-weight="700">LOOKING FOR TESTERS</text><text x="228" y="262" class="accent" font-size="15" >Explore the project →</text><rect x="606" y="74" width="58" height="58" rx="10" fill="#20204b" stroke="#745be0"/><rect x="674" y="74" width="58" height="58" rx="10" fill="#080823" stroke="#745be0"/><rect x="742" y="74" width="58" height="58" rx="10" fill="#080823" stroke="#745be0"/><rect x="606" y="142" width="58" height="58" rx="10" fill="#20204b" stroke="#745be0"/><rect x="674" y="142" width="58" height="58" rx="10" fill="#20204b" stroke="#745be0"/><rect x="742" y="142" width="58" height="58" rx="10" fill="#443d1d" stroke="#745be0"/><rect x="606" y="210" width="58" height="58" rx="10" fill="#080823" stroke="#745be0"/><rect x="674" y="210" width="58" height="58" rx="10" fill="#080823" stroke="#745be0"/><rect x="742" y="210" width="58" height="58" rx="10" fill="#080823" stroke="#745be0"/><text x="615" y="91" class="accent" font-size="11" font-weight="700">1</text><text x="615" y="159" class="accent" font-size="11" font-weight="700">2</text><text x="683" y="159" class="accent" font-size="11" font-weight="700">3</text><text x="751" y="159" class="gold" font-size="11" font-weight="700">GO</text><path d="M635 103 V171 H771" class="trail" pathLength="1" fill="none" stroke="#5affee" stroke-width="3" stroke-linecap="round" stroke-dasharray="1"/><circle cx="771" cy="171" r="23" class="trigger" fill="none" stroke="#ffff55" stroke-width="2"/><text x="704" y="301" class="mono" font-size="10" text-anchor="middle">MOVE → MATCH → TRIGGER</text>
</svg>
