<svg xmlns="http://www.w3.org/2000/svg" width="900" height="332" viewBox="0 0 900 332" role="img" aria-labelledby="title">
<title id="title">Motion Input Grid — movement follows three required cells to an action trigger</title>
<style>
text { font-family: Segoe UI, Arial, sans-serif; fill: #202440; }
.mono { font-family: Consolas, 'Liberation Mono', monospace; letter-spacing: 2px; fill: #5e6481; }
.muted { fill: #5e6481; }
.accent { fill: #4b52ad; }
.gold { fill: #84612c; }
.trail { animation: draw 6s ease-in-out infinite; }
@keyframes draw { 0%, 8% { stroke-dashoffset: 1; } 65%, 88% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 1; } }
.trigger { transform-box: fill-box; transform-origin: center; animation: pulse 6s ease-in-out infinite; }
@keyframes pulse { 0%, 60%, 100% { opacity: .25; transform: scale(.85); } 72%, 88% { opacity: 1; transform: scale(1.15); } }
.aircraft { filter: drop-shadow(0 0 5px #9baaff); } .bar { rx: 5; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .trail { stroke-dashoffset: 0 !important; } }
</style>
<rect x="1" y="1" width="898" height="330" rx="28" fill="#f1f3ff" stroke="#c4cbe9"/>
<defs><radialGradient id="glow"><stop stop-color="#4b52ad" stop-opacity=".17"/><stop offset="1" stop-color="#4b52ad" stop-opacity="0"/></radialGradient><linearGradient id="sheen" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".3"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><ellipse cx="740" cy="166" rx="155" ry="166" fill="url(#glow)"/><rect x="3" y="3" width="894" height="326" rx="26" fill="url(#sheen)" stroke="#fff" stroke-opacity=".18"/>
<text x="36" y="43" class="mono" font-size="12" >01 / CURRENT PROJECT</text><text x="36" y="96" class="" font-size="34" font-weight="700">Motion Input Grid</text><text x="36" y="133" class="accent" font-size="20" >Turn a movement into an action.</text><text x="36" y="176" class="muted" font-size="16" >An open-source motion input framework</text><text x="36" y="202" class="muted" font-size="16" >for websites, desktop applications and games.</text><rect x="36" y="238" width="172" height="36" rx="18" fill="#dfe4fb"/><text x="53" y="262" class="accent" font-size="12" font-weight="700">LOOKING FOR TESTERS</text><text x="228" y="262" class="accent" font-size="15" >Explore the project →</text><rect x="606" y="74" width="58" height="58" rx="10" fill="#dfe4fb" stroke="#c4cbe9"/><rect x="674" y="74" width="58" height="58" rx="10" fill="#f1f3ff" stroke="#c4cbe9"/><rect x="742" y="74" width="58" height="58" rx="10" fill="#f1f3ff" stroke="#c4cbe9"/><rect x="606" y="142" width="58" height="58" rx="10" fill="#dfe4fb" stroke="#c4cbe9"/><rect x="674" y="142" width="58" height="58" rx="10" fill="#dfe4fb" stroke="#c4cbe9"/><rect x="742" y="142" width="58" height="58" rx="10" fill="#f4e6cb" stroke="#c4cbe9"/><rect x="606" y="210" width="58" height="58" rx="10" fill="#f1f3ff" stroke="#c4cbe9"/><rect x="674" y="210" width="58" height="58" rx="10" fill="#f1f3ff" stroke="#c4cbe9"/><rect x="742" y="210" width="58" height="58" rx="10" fill="#f1f3ff" stroke="#c4cbe9"/><text x="615" y="91" class="accent" font-size="11" font-weight="700">1</text><text x="615" y="159" class="accent" font-size="11" font-weight="700">2</text><text x="683" y="159" class="accent" font-size="11" font-weight="700">3</text><text x="751" y="159" class="gold" font-size="11" font-weight="700">GO</text><path d="M635 103 V171 H771" class="trail" pathLength="1" fill="none" stroke="#4b52ad" stroke-width="3" stroke-linecap="round" stroke-dasharray="1"/><circle cx="771" cy="171" r="23" class="trigger" fill="none" stroke="#84612c" stroke-width="2"/><text x="704" y="301" class="mono" font-size="10" text-anchor="middle">MOVE → MATCH → TRIGGER</text>
</svg>
