<style>svg{font-family:Segoe UI, Arial, sans-serif;color:#f0f2ff;}.mono{font-family:'Lucida Console',Consolas,monospace;}
.trail{animation:recognize 7s ease-in-out infinite;}@keyframes recognize{0%,8%{stroke-dashoffset:1;}65%,90%{stroke-dashoffset:0;}100%{stroke-dashoffset:1;}}.confirm{animation:confirm 7s infinite;}@keyframes confirm{0%,60%,100%{opacity:.25;}70%,90%{opacity:1;}} .spatial-device{animation:spatial 8s ease-in-out infinite;}@keyframes spatial{50%{transform:translateY(-6px)}}.aurora-flow{animation:auroraflow 15s ease-in-out infinite alternate;}@keyframes auroraflow{to{transform:translateX(35px)}}.era-copy{animation:glass-copy 18s ease-in-out infinite}.meter-head{animation:glass-sweep 8s ease-in-out infinite} .wave-one{animation:wave-one 19s ease-in-out infinite alternate}.wave-two{animation:wave-two 23s ease-in-out -7s infinite alternate}.wave-three{animation:wave-three 17s ease-in-out -4s infinite alternate}@keyframes glass-sweep{0%,12%{transform:translateX(-50px);opacity:0}30%{opacity:.7}88%,100%{transform:translateX(var(--travel));opacity:0}}@keyframes glass-copy{0%,100%{opacity:.8}45%,75%{opacity:1}}@keyframes wave-one{to{transform:translate(55px,-43px) rotate(5deg)}}@keyframes wave-two{to{transform:translate(-48px,37px) rotate(-4deg)}}@keyframes wave-three{to{transform:translate(25px,48px) scaleY(.8)}}.era-copy{transform-box:fill-box;animation-delay:var(--copy-phase,0s)}.meter-head,.meter-dot{animation-delay:var(--phase,0s)!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;}.trail{stroke-dashoffset:0!important;}}
