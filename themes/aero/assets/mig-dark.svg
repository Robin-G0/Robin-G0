<svg xmlns="http://www.w3.org/2000/svg" width="900" height="332" viewBox="0 0 900 332" role="img" aria-labelledby="title">
<title id="title">Motion Input Grid — movement follows three required cells to an action trigger</title>
<style>
text { font-family: Trebuchet MS, sans-serif; fill: #e5faff; }
.mono { font-family: Consolas, 'Liberation Mono', monospace; letter-spacing: 2px; fill: #a3cddc; }
.muted { fill: #a3cddc; }
.accent { fill: #83dbff; }
.gold { fill: #d1f58e; }
.trail { animation: draw 6s ease-in-out infinite; }
@keyframes draw { 0%, 8% { stroke-dashoffset: 1; } 65%, 88% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 1; } }
.trigger { transform-box: fill-box; transform-origin: center; animation: pulse 6s ease-in-out infinite; }
@keyframes pulse { 0%, 60%, 100% { opacity: .25; transform: scale(.85); } 72%, 88% { opacity: 1; transform: scale(1.15); } }
.bubble { animation: bubble 5s ease-in-out infinite; } @keyframes bubble { 50% { transform: translateY(-6px); } } .bar { filter: drop-shadow(0 2px 1px #55889955); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .trail { stroke-dashoffset: 0 !important; } }
</style>
<rect x="1" y="1" width="898" height="330" rx="24" fill="#102c40" stroke="#407a95"/>
<defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#83dbff" stop-opacity=".16"/><stop offset="1" stop-color="#204d65" stop-opacity="0"/></linearGradient></defs><rect x="2" y="2" width="896" height="328" rx="24" fill="url(#sky)"/><path d="M3 306 Q210 267 450 307 T897 297 V330 H3Z" fill="#d1f58e" opacity=".12"/><circle cx="821" cy="55" r="22" fill="#fff" fill-opacity=".1" stroke="#83dbff" stroke-opacity=".2" class="bubble"/><circle cx="855" cy="100" r="11" fill="#fff" fill-opacity=".1" stroke="#83dbff" stroke-opacity=".2" class="bubble"/><circle cx="565" cy="75" r="14" fill="#fff" fill-opacity=".1" stroke="#83dbff" stroke-opacity=".2" class="bubble"/>
<text x="36" y="43" class="mono" font-size="12" >01 / CURRENT PROJECT</text><text x="36" y="96" class="" font-size="34" font-weight="700">Motion Input Grid</text><text x="36" y="133" class="accent" font-size="20" >Turn a movement into an action.</text><text x="36" y="176" class="muted" font-size="16" >An open-source motion input framework</text><text x="36" y="202" class="muted" font-size="16" >for websites, desktop applications and games.</text><rect x="36" y="238" width="172" height="36" rx="18" fill="#204d65"/><text x="53" y="262" class="accent" font-size="12" font-weight="700">LOOKING FOR TESTERS</text><text x="228" y="262" class="accent" font-size="15" >Explore the project →</text><rect x="606" y="74" width="58" height="58" rx="10" fill="#204d65" stroke="#407a95"/><rect x="674" y="74" width="58" height="58" rx="10" fill="#102c40" stroke="#407a95"/><rect x="742" y="74" width="58" height="58" rx="10" fill="#102c40" stroke="#407a95"/><rect x="606" y="142" width="58" height="58" rx="10" fill="#204d65" stroke="#407a95"/><rect x="674" y="142" width="58" height="58" rx="10" fill="#204d65" stroke="#407a95"/><rect x="742" y="142" width="58" height="58" rx="10" fill="#3b542d" stroke="#407a95"/><rect x="606" y="210" width="58" height="58" rx="10" fill="#102c40" stroke="#407a95"/><rect x="674" y="210" width="58" height="58" rx="10" fill="#102c40" stroke="#407a95"/><rect x="742" y="210" width="58" height="58" rx="10" fill="#102c40" stroke="#407a95"/><text x="615" y="91" class="accent" font-size="11" font-weight="700">1</text><text x="615" y="159" class="accent" font-size="11" font-weight="700">2</text><text x="683" y="159" class="accent" font-size="11" font-weight="700">3</text><text x="751" y="159" class="gold" font-size="11" font-weight="700">GO</text><path d="M635 103 V171 H771" class="trail" pathLength="1" fill="none" stroke="#83dbff" stroke-width="3" stroke-linecap="round" stroke-dasharray="1"/><circle cx="771" cy="171" r="23" class="trigger" fill="none" stroke="#d1f58e" stroke-width="2"/><text x="704" y="301" class="mono" font-size="10" text-anchor="middle">MOVE → MATCH → TRIGGER</text>
</svg>
