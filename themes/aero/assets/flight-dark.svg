<text x="36" y="43" class="mono" font-size="12" >ROBIN-G0 / IDEAS ACROSS ERAS</text><text x="36" y="93" class="" font-size="42" font-weight="700">Ideas in motion.</text><text x="36" y="124" class="muted" font-size="18" >Software engineering · Research &amp; development</text><path d="M 180 236 C 320 130 580 130 720 236" fill="none" stroke="#407a95" stroke-width="2" stroke-dasharray="4 8"/><circle cx="180" cy="236" r="7" fill="#204d65" stroke="#83dbff" stroke-width="2"/><text x="180" y="274" class="mono" font-size="14" text-anchor="middle">CANADA</text><text x="180" y="297" class="muted" font-size="12" text-anchor="middle">CA</text><circle cx="720" cy="236" r="7" fill="#204d65" stroke="#83dbff" stroke-width="2"/><text x="720" y="274" class="mono" font-size="14" text-anchor="middle">FRANCE</text><text x="720" y="297" class="muted" font-size="12" text-anchor="middle">FR</text><g class="aircraft">
