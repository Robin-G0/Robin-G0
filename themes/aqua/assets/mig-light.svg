<text x="36" y="43" class="mono" font-size="12" >01 / CURRENT PROJECT</text><text x="36" y="96" class="" font-size="34" font-weight="700">Motion Input Grid</text><text x="36" y="133" class="accent" font-size="20" >Turn a movement into an action.</text><text x="36" y="176" class="muted" font-size="16" >An open-source motion input framework</text><text x="36" y="202" class="muted" font-size="16" >for websites, desktop applications and games.</text><rect x="36" y="238" width="172" height="36" rx="18" fill="#d1e9fd"/><text x="53" y="262" class="accent" font-size="12" font-weight="700">LOOKING FOR TESTERS</text><text x="228" y="262" class="accent" font-size="15" >Explore the project →</text><rect x="606" y="74" width="58" height="58" rx="10" fill="#d1e9fd" stroke="#9db7d0"/><rect x="674" y="74" width="58" height="58" rx="10" fill="#f5faff" stroke="#9db7d0"/><rect x="742" y="74" width="58" height="58" rx="10" fill="#f5faff" stroke="#9db7d0"/><rect x="606" y="142" width="58" height="58" rx="10" fill="#d1e9fd" stroke="#9db7d0"/><rect x="674" y="142" width="58" height="58" rx="10" fill="#d1e9fd" stroke="#9db7d0"/><rect x="742" y="142" width="58" height="58" rx="10" fill="#f9edbd" stroke="#9db7d0"/><rect x="606" y="210" width="58" height="58" rx="10" fill="#f5faff" stroke="#9db7d0"/><rect x="674" y="210" width="58" height="58" rx="10" fill="#f5faff" stroke="#9db7d0"/><rect x="742" y="210" width="58" height="58" rx="10" fill="#f5faff" stroke="#9db7d0"/><text x="615" y="91" class="accent" font-size="11" font-weight="700">1</text><text x="615" y="159" class="accent" font-size="11" font-weight="700">2</text><text x="683" y="159" class="accent" font-size="11" font-weight="700">3</text><text x="751" y="159" class="gold" font-size="11" font-weight="700">GO</text><path d="M635 103 V171 H771" class="trail" pathLength="1" fill="none" stroke="#075fbb" stroke-width="3" stroke-linecap="round" stroke-dasharray="1"/><circle cx="771" cy="171" r="23" class="trigger" fill="none" stroke="#775d1