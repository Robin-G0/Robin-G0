.mono { font-family: Consolas, 'Liberation Mono', monospace; letter-spacing: 2px; fill: #c0b6cf; }
.muted { fill: #c0b6cf; }
.accent { fill: #c6b4ff; }
.gold { fill: #ffcf78; }
.aircraft { offset-path: path('M 180 236 C 320 130 580 130 720 236'); offset-rotate: auto; offset-distance: 50%; animation: flight 16s linear infinite; }
@keyframes flight { 0%, 6% { offset-distance: 0%; offset-rotate: auto; } 44%, 49% { offset-distance: 100%; offset-rotate: auto; } 50%, 56% { offset-distance: 100%; offset-rotate: reverse; } 94%, 99% { offset-distance: 0%; offset-rotate: reverse; } 100% { offset-distance: 0%; offset-rotate: auto; } }
.trigger { stroke-width: 6; } .bar { filter: drop-shadow(0 2px 1px #00000022); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .trail { stroke-dashoffset: 0 !important; } }
</style>
