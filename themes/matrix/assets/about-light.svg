oke="#42f587" stroke-width="1" /><circle cx="329" cy="202" r="2" fill="#e2ffe9" stroke="none" class="bio-vision-point" style="animation-delay:-3.66s"/><rect x="36" y="186" width="2" height="58" rx="0" fill="#a6ffd0" stroke="none" class="bio-vision-scan"/></g><g transform="translate(695 215)"><circle r="28" fill="none" stroke="#2d794b"/><ellipse rx="28" ry="9" fill="none" stroke="#2d794b"/><ellipse rx="10" ry="28" fill="none" stroke="#2d794b"/><path d="M-39 0H39M0 -35V35" fill="none" stroke="#42f587" stroke-width="0.6" opacity=".6"/><g class="bio-qubit-state"><path d="M0 0L18 -21" fill="none" stroke="#42f587" stroke-width="1.4" /><circle cx="18" cy="-21" r="3" fill="#dbffe8" stroke="none" /></g></g></g></svg>