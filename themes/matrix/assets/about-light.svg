<style>svg{font-family:Consolas, monospace;color:#c4ffcf;}.mono{font-family:'Lucida Console',Consolas,monospace;}
.bio-vision-scan{animation:bio-vision-scan 6s linear infinite}.bio-vision-point{animation:bio-vision-lock 4.3s steps(2) infinite}.bio-qubit-state{animation:bio-qubit 12s linear infinite}
@keyframes bio-vision-scan{from{transform:translateX(0)}to{transform:translateX(365px)}}@keyframes bio-vision-lock{0%,80%,100%{opacity:.45}30%,60%{opacity:1}}@keyframes bio-qubit{to{transform:rotate(360deg)}} .tracking-scan{animation:tracking 6s linear infinite;}@keyframes tracking{0%{opacity:0;transform:translateY(0)}10%,85%{opacity:.6}100%{opacity:0;transform:translateY(240px)}}.era-copy{animation:decode-write 19s steps(32,end) infinite}.meter-head{animation:meter-step 8s steps(24,end) infinite}@keyframes meter-step{0%,12%{transform:translateX(-40px)}75%,100%{transform:translateX(var(--travel))}}@keyframes decode-write{0%,3%{clip-path:inset(0 100% 0 0);opacity:.4}20%,100%{clip-path:inset(0);opacity:1}}.era-copy{transform-box:fill-box;animation-delay:var(--copy-phase,0s)}.meter-head,.meter-dot{animation-delay:var(--phase,0s)!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;}.trail{stroke-dashoffset:0!important;}}
