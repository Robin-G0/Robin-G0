<svg xmlns="http://www.w3.org/2000/svg" width="900" height="332" viewBox="0 0 900 332" role="img" aria-labelledby="title">
<title id="title">Motion Input Grid — movement follows three required cells to an action trigger</title>
<style>
text { font-family: Segoe UI, Arial, sans-serif; fill: #ffffff; }
.mono { font-family: Consolas, 'Liberation Mono', monospace; letter-spacing: 2px; fill: #b9cee2; }
.muted { fill: #b9cee2; }
.accent { fill: #5fc5ff; }
.gold { fill: #efafff; }
.trail { animation: draw 6s ease-in-out infinite; }
@keyframes draw { 0%, 8% { stroke-dashoffset: 1; } 65%, 88% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 1; } }
.trigger { transform-box: fill-box; transform-origin: center; animation: pulse 6s ease-in-out infinite; }
@keyframes pulse { 0%, 60%, 100% { opacity: .25; transform: scale(.85); } 72%, 88% { opacity: 1; transform: scale(1.15); } }
text { font-weight: 300; } rect { rx: 0; } .trigger { stroke-width: 4; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .trail { stroke-dashoffset: 0 !important; } }
</style>
<rect x="1" y="1" width="898" height="330" rx="0" fill="#101c2d" stroke="#3a5474"/>
<rect x="1" y="1" width="10" height="330" fill="#5fc5ff"/><rect x="803" y="12" width="24" height="10" fill="#5fc5ff"/><rect x="831" y="12" width="24" height="10" fill="#efafff"/><rect x="859" y="12" width="24" height="10" fill="#b9cee2"/>
<text x="36" y="43" class="mono" font-size="12" >01 / CURRENT PROJECT</text><text x="36" y="96" class="" font-size="34" font-weight="700">Motion Input Grid</text><text x="36" y="133" class="accent" font-size="20" >Turn a movement into an action.</text><text x="36" y="176" class="muted" font-size="16" >An open-source motion input framework</text><text x="36" y="202" class="muted" font-size="16" >for websites, desktop applications and games.</text><rect x="36" y="238" width="172" height="36" rx="18" fill="#123e60"/><text x="53" y="262" class="accent" font-size="12" font-weight="700">LOOKING FOR TESTERS</text><text x="228" y="262" class="accent" font-size="15" >Explore the project →</text><rect x="606" y="74" width="58" height="58" rx="10" fill="#123e60" stroke="#3a5474"/><rect x="674" y="74" width="58" height="58" rx="10" fill="#101c2d" stroke="#3a5474"/><rect x="742" y="74" width="58" height="58" rx="10" fill="#101c2d" stroke="#3a5474"/><rect x="606" y="142" width="58" height="58" rx="10" fill="#123e60" stroke="#3a5474"/><rect x="674" y="142" width="58" height="58" rx="10" fill="#123e60" stroke="#3a5474"/><rect x="742" y="142" width="58" height="58" rx="10" fill="#4a2858" stroke="#3a5474"/><rect x="606" y="210" width="58" height="58" rx="10" fill="#101c2d" stroke="#3a5474"/><rect x="674" y="210" width="58" height="58" rx="10" fill="#101c2d" stroke="#3a5474"/><rect x="742" y="210" width="58" height="58" rx="10" fill="#101c2d" stroke="#3a5474"/><text x="615" y="91" class="accent" font-size="11" font-weight="700">1</text><text x="615" y="159" class="accent" font-size="11" font-weight="700">2</text><text x="683" y="159" class="accent" font-size="11" font-weight="700">3</text><text x="751" y="159" class="gold" font-size="11" font-weight="700">GO</text><path d="M635 103 V171 H771" class="trail" pathLength="1" fill="none" stroke="#5fc5ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="1"/><circle cx="771" cy="171" r="23" class="trigger" fill="none" stroke="#efafff" stroke-width="2"/><text x="704" y="301" class="mono" font-size="10" text-anchor="middle">MOVE → MATCH → TRIGGER</text>
</svg>
