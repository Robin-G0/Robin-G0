<style>text{font-family:Arial, sans-serif;}svg{color:#162254;}.mono{font-family:'Lucida Console',Consolas,monospace;}
.stat-fill{transform-box:fill-box;transform-origin:left;animation:download-fill 1.4s ease-out backwards;}
.stat-sheen{animation:download-shine var(--duration,5s) ease-in-out infinite;}
@keyframes download-fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes download-shine{0%,12%{transform:translateX(0)}68%,100%{transform:translateX(var(--travel))}}
.orbit{transform-origin:700px 205px;animation:orbit 9s ease-in-out infinite;}@keyframes orbit{50%{transform:rotate(-8deg);}}.trail{animation:recognize 7s ease-in-out infinite;}@keyframes recognize{0%,8%{stroke-dashoffset:1;}65%,90%{stroke-dashoffset:0;}100%{stroke-dashoffset:1;}}.confirm{animation:confirm 7s infinite;}@keyframes confirm{0%,60%,100%{opacity:.25;}70%,90%{opacity:1;}} .device-float{animation:levitate 6s ease-in-out infinite;}@keyframes levitate{50%{transform:translateY(-7px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;}.trail{stroke-dashoffset:0!important;}}
