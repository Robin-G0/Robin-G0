<style>svg{font-family:Arial, sans-serif;color:#eef2ff;}.mono{font-family:'Lucida Console',Consolas,monospace;}
.bio-chrome-equalizer{transform-box:fill-box;transform-origin:center;animation:bio-equalizer 2.4s ease-in-out infinite}.bio-chrome-glint{animation:bio-chrome-glint 5s cubic-bezier(.7,0,.2,1) infinite}
@keyframes bio-equalizer{0%,100%{transform:scaleY(.4);opacity:.5}40%{transform:scaleY(1);opacity:1}}
@keyframes bio-chrome-glint{0%,10%{transform:translateX(-80px)}80%,100%{transform:translateX(370px)}} .device-float{animation:levitate 6s ease-in-out infinite;}@keyframes levitate{50%{transform:translateY(-7px)}}.era-copy{animation:chrome-copy 13s ease-in-out infinite}.meter-head{animation:chrome-sweep 5s cubic-bezier(.7,0,.2,1) infinite}@keyframes chrome-sweep{0%,15%{transform:translateX(-40px)}70%,100%{transform:translateX(var(--travel))}}@keyframes chrome-copy{0%,100%{letter-spacing:1px}50%{letter-spacing:1.6px}}.era-copy{transform-box:fill-box;animation-delay:var(--copy-phase,0s)}.meter-head,.meter-dot{animation-delay:var(--phase,0s)!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;}.trail{stroke-dashoffset:0!important;}}
